<!doctype html>
<html><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Barlow:wght@500;600&display=swap" rel="stylesheet" />
<!-- The link-preview card (1200x630). Render: see render-og.cjs. -->
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #000; }
  .card { position: relative; width: 1200px; height: 630px; display: grid; place-content: center; justify-items: center; text-align: center; color: #eef3ee; }
  .bg { position: absolute; inset: 0; background: url("../public/hero.jpg") center 40% / cover; filter: brightness(.55) contrast(1.05); }
  .shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 46%, transparent 0 25%, rgba(0,0,0,.72) 80%), linear-gradient(rgba(0,0,0,.35), transparent 30%, transparent 60%, rgba(0,0,0,.85)); }
  .top { position: relative; font: 600 26px/1 "Cinzel", serif; letter-spacing: .9em; margin-right: -.9em; margin-bottom: 18px; }
  .wm { position: relative; font: 900 128px/.95 "Cinzel", serif; background: linear-gradient(180deg,#fff 8%,#d4d4d0 40%,#77776f 53%,#ecece8 61%,#94948c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 6px rgba(0,0,0,.55)); }
  .tag { position: relative; margin-top: 30px; font: 500 32px/1.3 "Barlow", sans-serif; color: #e9ede9; }
  .url { position: absolute; bottom: 34px; left: 0; right: 0; text-align: center; font: 600 26px/1 "Barlow", sans-serif; color: #8dff6a; }
</style></head>
<body><div class="card">
  <div class="bg"></div><div class="shade"></div>
  <p class="top">Road to</p>
  <p class="wm">DOOMSDAY</p>
  <p class="tag">Every MCU movie and show you need before Doomsday, in order</p>
  <p class="url">countdowntodoom.vercel.app</p>
</div></body></html>
